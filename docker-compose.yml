services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - '3002:3002'
    volumes:
      - ./backend/database/data:/app/backend/database/data
    networks:
      - zentask-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - '3000:80'
    environment:
      - REACT_APP_API_URL=http://localhost:3002
    depends_on:
      - backend
    networks:
      - zentask-network

networks:
  zentask-network:
    driver: bridge
